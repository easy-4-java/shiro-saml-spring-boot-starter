# CI workflow for easy4j Spring Boot Starter
#
# Triggers:
#   - push / pull_request on all version-line branches
#   - manual workflow_dispatch
#
# JDK matrix by version line:
#   - 2.3.x / 2.7.x : JDK 8
#   - 3.0.x ~ 3.5.x : JDK 17
#   - 4.0.x / 4.1.x : JDK 17 / 21
#
# Runs `mvn -B clean verify` with dependency convergence checks.
name: CI

on:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x, master, main, 'test/**']
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x, master, main, 'test/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Configure Maven repositories
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          settings = ET.fromstring(os.environ["MAVEN_SETTINGS_XML"])
          for mirror in settings.findall(".//{*}mirror"):
              mirror_of = mirror.find("{*}mirrorOf")
              if mirror_of is not None and mirror_of.text:
                  rules = mirror_of.text.split(",")
                  if "*" in rules and "!shibboleth-releases" not in rules:
                      mirror_of.text += ",!shibboleth-releases"
          ET.ElementTree(settings).write(Path.home() / ".m2/settings.xml", encoding="utf-8")
          PYTHON

      - name: Build and verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 14
